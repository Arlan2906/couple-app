<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш мультик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one centered "cinema" player, caption card under the frame, controls row. Single night theme by choice. */
:root{
  --bg:#17121f; --panel:#221a2c; --line:#3b2f47; --fg:#f8ece4; --muted:#bcaabd;
  --rose:#ff8fa8; --gold:#f5c46b;
  --hand:'Neucha','Comic Sans MS',cursive; --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{margin:0;min-height:100vh;color:var(--fg);font-family:var(--body);
  background:radial-gradient(120% 60% at 50% -10%,#3a2450 0%,rgba(58,36,80,0) 60%),radial-gradient(90% 50% at 50% 110%,#4a2440 0%,rgba(74,36,64,0) 60%),var(--bg);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.back{font:700 14px var(--body);color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;align-self:flex-start}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{text-align:center}
header h1{font-family:var(--hand);font-weight:400;font-size:clamp(38px,10vw,56px);margin:0;line-height:1;text-wrap:balance;text-shadow:0 4px 24px rgba(255,143,168,.35)}
header h1 span{color:var(--rose);display:inline-block;animation:hbeat 1.6s ease-in-out infinite}
@keyframes hbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
header p{margin:8px 0 0;color:var(--muted);font-size:15px}
.frame{position:relative;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff8fa8,#f5c46b 45%,#b98cff);box-shadow:0 26px 60px -22px rgba(255,143,168,.6),0 0 0 1px rgba(255,255,255,.08)}
.stage{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:21px;overflow:hidden;background:#0d0a12;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage svg{display:block;width:100%;height:100%}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));box-shadow:0 0 10px rgba(255,143,168,.8)}
.bar.run{animation:bar linear forwards}
@keyframes bar{to{width:100%}}
.chip{position:absolute;right:10px;bottom:12px;font:800 12px var(--body);color:#fff;background:rgba(20,14,28,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:999px;padding:5px 10px;pointer-events:none}
.startbtn{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font:800 17px var(--body);padding:13px 28px;border-radius:999px;border:0;
  background:linear-gradient(135deg,#ff9db4,#ff6f91);color:#fff;cursor:pointer;box-shadow:0 10px 26px -6px rgba(255,111,145,.85),inset 0 1px 0 rgba(255,255,255,.4);white-space:nowrap;animation:sbp 2s ease-in-out infinite}
@keyframes sbp{50%{transform:translateX(-50%) scale(1.05)}}
.startbtn:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cap{position:relative;background:linear-gradient(160deg,#2a2036,#221a2c);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px;min-height:112px;box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}
.cap::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--rose),var(--gold))}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;min-height:15px}
.captext{font-family:var(--hand);font-size:clamp(21px,4.9vw,26px);line-height:1.32;margin-top:5px}
.captext.in{animation:capin .7s ease both}
@keyframes capin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;gap:8px}
.btn{font:700 14px var(--body);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn.main{flex:1;background:linear-gradient(135deg,#ff9db4,#ff6f91);border:0;color:#fff;font-weight:800;box-shadow:0 8px 20px -8px rgba(255,111,145,.8)}
.btn:active{transform:translateY(1px)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:2px 0}
.dot{width:8px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer;transition:width .3s,background .3s}
.dot.done{background:#7a5068}
.dot.on{background:linear-gradient(90deg,var(--rose),var(--gold));width:22px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:0}

/* scene animation */
.scn{animation:scin .9s ease both}
@keyframes scin{from{opacity:0}to{opacity:1}}
.kb,.kb2{transform-box:view-box;transform-origin:200px 180px}
.kb{animation:kb 8s ease-out both}.kb2{animation:kb2 8s ease-out both}
@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
@keyframes kb2{from{transform:scale(1)}to{transform:scale(1.06)}}
.legA,.legB{transform-box:fill-box;transform-origin:50% 0;animation:step .7s ease-in-out infinite}
.legB{animation-delay:-.35s}
@keyframes step{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
.bobw{animation:bobw .35s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(-1.6px)}}
.float{animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-9px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.shoot{animation:shoot 6s ease-in infinite}
@keyframes shoot{0%,70%{opacity:0;transform:translate(0,0)}74%{opacity:1}100%{opacity:0;transform:translate(-120px,60px)}}
.flip{transform-box:fill-box;transform-origin:center;animation:flip 2.2s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes flip{0%,18%{transform:translateY(0) rotate(0)}50%{transform:translateY(-38px) rotate(200deg)}82%,100%{transform:translateY(0) rotate(360deg)}}
.sizz{animation:sizz .6s ease-out infinite}
@keyframes sizz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx,4px),-16px)}}
.cloud{animation:cloud 14s linear infinite alternate}
@keyframes cloud{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.hand{font-family:var(--hand)} .ui{font-family:var(--body)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.popbig{transform-box:fill-box;transform-origin:center;animation:popbig 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popbig{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.rise{animation:rise 3.4s ease-in infinite both}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.15)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall 7s linear infinite}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,320px) rotate(400deg)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.flick{animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.75}}
.flick2{animation:flick2 .9s steps(3) infinite}
@keyframes flick2{0%{opacity:1}33%{opacity:.8}66%{opacity:.93}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.drift-r{animation:dr 7s ease-in-out both}
@keyframes dr{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.drift-l{animation:dl 7s ease-in-out both}
@keyframes dl{from{transform:translateX(26px)}to{transform:translateX(-26px)}}
.drive{animation:drive 5s linear infinite}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.sunup{animation:sunup 6.5s ease-out both}
@keyframes sunup{from{transform:translateY(70px)}to{transform:translateY(0)}}
.fadeout{animation:fadeout 5.5s ease-out both}
@keyframes fadeout{from{opacity:.85}to{opacity:0}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flame .5s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.glowtext{animation:flick 2.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .stage *{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .captext.in{animation:none}
}
</style>
</head>
<body>


<div class="wrap">
  <button class="back" id="back" type="button">← Назад</button>
  <header>
    <h1>Арлан <span>+</span> Настя</h1>
    <p>Мультик о нас: как всё началось и как мы живём сейчас</p>
  </header>

  <div class="frame"><div class="stage" id="stage" role="button" tabindex="0" aria-label="Следующая сцена">
    <svg id="sv" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="chip" id="chip"></div>
    <div class="bar" id="bar"></div>
    <button class="startbtn" id="start" type="button">▶ Смотреть</button>
  </div></div>

  <div class="cap" aria-live="polite">
    <div class="eyebrow" id="eb"></div>
    <div class="captext" id="ct"></div>
  </div>

  <div class="dots" id="dots"></div>
  <div class="controls">
    <button class="btn" id="prev" type="button" aria-label="Назад">◀</button>
    <button class="btn main" id="play" type="button">❚❚ Пауза</button>
    <button class="btn" id="mus" type="button">♪ Музыка</button>
    <button class="btn" id="next" type="button" aria-label="Вперёд">▶</button>
  </div>
  <p class="hint">Нажми на кадр, чтобы перейти к следующей сцене</p>
</div>

<script>
/* Telegram Mini App: системная кнопка «Назад» возвращает в приложение */
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const goBack=()=>{if(history.length>1)history.back();else location.href='/'};
document.getElementById('back').onclick=goBack;
if(tg?.BackButton&&tg.isVersionAtLeast?.('6.1')){tg.BackButton.show();tg.BackButton.onClick(goBack)}
/* ---------- helpers ---------- */
const R=seed=>{let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647};
const f1=n=>n.toFixed(1);
function stars(n,maxY=150,seed=3){const r=R(seed);let o='';for(let k=0;k<n;k++){o+=`<circle class="tw" style="animation-delay:${f1(r()*3)}s" cx="${f1(r()*400)}" cy="${f1(r()*maxY)}" r="${(r()*1.1+.3).toFixed(2)}" fill="#fff"/>`}return o}
const HEART='M0 8 C -10 0 -12 -8 -6 -10 C -3 -11 -1 -9 0 -7 C 1 -9 3 -11 6 -10 C 12 -8 10 0 0 8Z';
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="${HEART}" fill="${c}"/>`;
function rising(x,y,n,seed=9,base=0){const r=R(seed);let o='';for(let k=0;k<n;k++){o+=`<g class="rise" style="animation-delay:${f1(base+k*.6+r()*.3)}s">${heart(f1(x+(r()-.5)*40),f1(y+(r()-.5)*10),(r()*.5+.7).toFixed(2),k%2?'#ff8fa8':'#ff5f7e')}</g>`}return o}
function bubble(x,y,t,d=0,side='l'){if(window.__nob)return '';const w=t.length*6.4+24,bx=x-w/2;
  const tail=side==='none'?`<circle cx="${x-8}" cy="${y+17}" r="3" fill="#fffaf5" stroke="#2b2030" stroke-width="1.2"/><circle cx="${x-13}" cy="${y+24}" r="2" fill="#fffaf5" stroke="#2b2030" stroke-width="1.2"/>`
   :side==='l'?`<path d="M${x-w/4},${y+10} l-7,10 l14,-10" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4" stroke-linejoin="round"/>`
   :`<path d="M${x+w/4},${y+10} l7,10 l-14,-10" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4" stroke-linejoin="round"/>`;
  return `<g class="pop" style="animation-delay:${d}s">${tail}<rect x="${f1(bx)}" y="${y-13}" width="${f1(w)}" height="24" rx="12" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4"/><rect x="${f1(bx+1)}" y="${y+5}" width="${f1(w-2)}" height="5" fill="#fffaf5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11.5" font-weight="800" class="ui" fill="#2b2030">${t}</text></g>`}
const hu=(x,y,s,w)=>[x+(w+10)*s,y-67*s];

/* ---------- characters ---------- */
const G={sk:'#c68a60',sk2:'#a96f48',hair:'#1a120e',hair2:'#4a362c'}, N={sk:'#f6cbb0',sk2:'#e3a98c',hair:'#5b3a29',hair2:'#8a5c40',hair3:'#40271b'};
const gshadow=rx=>`<ellipse cx="0" cy="1.6" rx="${rx}" ry="3.8" fill="#000" opacity=".24"/>`;
function eyes(o,dx,y,col,girl){const lk=(o.look||0)*.9;
  if(o.mood==='laugh'||o.eyes==='closed'){const up=o.eyes==='closed'&&o.mood!=='laugh';
    const arc=x=>up?`M${x-3.2},${y-.4} Q${x},${y+2.8} ${x+3.2},${y-.4}`:`M${x-3.2},${y+1} Q${x},${y-3.2} ${x+3.2},${y+1}`;
    return `<path d="${arc(-dx)} ${arc(dx)}" stroke="#2a1a14" stroke-width="1.8" fill="none" stroke-linecap="round"/>${girl?`<path d="M${-dx-3.4},${y+.4} l-1.8,-1 M${dx+3.4},${y+.4} l1.8,-1" stroke="#2a1a14" stroke-width="1" stroke-linecap="round"/>`:''}`}
  const e=x=>`<ellipse cx="${x+lk}" cy="${y}" rx="2.7" ry="3.2" fill="#24150f"/>${girl?`<ellipse cx="${x+lk}" cy="${y+.3}" rx="2" ry="2.5" fill="${col}"/><circle cx="${x+lk}" cy="${y+.4}" r="1.1" fill="#160d0a"/>`:''}<circle cx="${x+lk+.9}" cy="${y-1.2}" r="1" fill="#fff"/><circle cx="${x+lk-.9}" cy="${y+1.3}" r=".45" fill="#fff" opacity=".85"/>`;
  return `<g class="blink">${e(-dx)}${e(dx)}</g>${girl?`<path d="M${-dx-2.9},${y-2.4} l-2.2,-1.5 M${-dx-3.2},${y-.6} l-2,-.5 M${dx+2.9},${y-2.4} l2.2,-1.5 M${dx+3.2},${y-.6} l2,-.5" stroke="#2a1a14" stroke-width="1" stroke-linecap="round"/>`:''}`}
function brows(o,dx,y,c,w=1.6){const up=(o.mood==='o'||o.blush)?-1:0;
  return `<path d="M${-dx-3.6},${y+up} q3.4,-2.2 7,-.5 M${dx+3.6},${y+up} q-3.4,-2.2 -7,-.5" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`}
function mouth(o,y){const m=o.mood||'smile';
  if(m==='laugh')return `<path d="M-7,${y-2} Q0,${y+9.5} 7,${y-2}Z" fill="#7a2e33"/><path d="M-5.2,${y-1.4} H5.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><path d="M-3.4,${y+3.6} Q0,${y+1.8} 3.4,${y+3.6} Q0,${y+6.6} -3.4,${y+3.6}Z" fill="#e8768a"/>`;
  if(m==='o')return `<ellipse cx="0" cy="${y}" rx="2.6" ry="3.2" fill="#7a2e33"/>`;
  if(m==='soft')return `<path d="M-4,${y-.8} Q0,${y+2.6} 4,${y-.8}" stroke="#5a2a24" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  return `<path d="M-5.8,${y-1.6} Q0,${y+4.2} 5.8,${y-1.6}" stroke="#5a2a24" stroke-width="1.9" fill="none" stroke-linecap="round"/><path d="M-6.6,${y-2} l-1.2,-.9 M6.6,${y-2} l1.2,-.9" stroke="#5a2a24" stroke-width="1" stroke-linecap="round" opacity=".6"/>`}
function blush(o,y,dx=12){const op=o.blush?.62:.26;return `<ellipse cx="${-dx}" cy="${y}" rx="4.6" ry="2.7" fill="#ff7f8e" opacity="${op}"/><ellipse cx="${dx}" cy="${y}" rx="4.6" ry="2.7" fill="#ff7f8e" opacity="${op}"/>${o.blush?`<path d="M${-dx-2.4},${y+.8} l1.4,-1.8 M${-dx},${y+.8} l1.4,-1.8 M${dx-1.4},${y+.8} l1.4,-1.8 M${dx+1},${y+.8} l1.4,-1.8" stroke="#ff5f7e" stroke-width=".7" opacity=".55"/>`:''}`}
function arms(o,top,sk,w){
  const hand=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.2" fill="${sk}"/><circle cx="${x-1}" cy="${y-1}" r="1.6" fill="#fff" opacity=".18"/>`;
  const seg=(d)=>`<path d="${d}" stroke="${top}" stroke-width="7.4" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#000" stroke-opacity=".12" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(1.6 .8)"/>`;
  const L=o.armL==='up'?seg(`M${-w},-49 Q${-w-12},-50 ${-w-10},-64`)+hand(-w-10,-67)
    :o.armL==='in'?seg(`M${-w},-49 Q${-w-7},-40 ${-w+4},-33`)+hand(-w+6,-32)
    :seg(`M${-w},-49 Q${-w-8},-38 ${-w-5},-27`)+hand(-w-5,-25);
  const Rr=o.arm==='up'?seg(`M${w},-49 Q${w+12},-50 ${w+10},-64`)+hand(w+10,-67)
    :o.arm==='mid'?seg(`M${w},-49 Q${w+10},-44 ${w+13},-38`)+hand(w+15,-36)
    :o.arm==='in'?seg(`M${w},-49 Q${w+7},-40 ${w-4},-33`)+hand(w-6,-32)
    :seg(`M${w},-49 Q${w+8},-38 ${w+5},-27`)+hand(w+5,-25);
  return L+Rr}
const apron=(c='#8d8a6f',logo=true)=>`<path d="M-13,-47 L13,-47 L15,-14 L-15,-14Z" fill="${c}"/><path d="M-13,-47 L-9,-47 L-11,-14 L-15,-14Z" fill="#fff" opacity=".12"/><path d="M-11,-47 L-15,-54 M11,-47 L15,-54" stroke="${c}" stroke-width="2.5"/>${logo?`<circle cx="0" cy="-33" r="4.5" fill="none" stroke="#f3f0e6" stroke-width="1.2"/><circle cx="-9" cy="-44" r="1.6" fill="#cfcfcf"/><circle cx="9" cy="-44" r="1.6" fill="#cfcfcf"/>`:`<rect x="-6" y="-32" width="12" height="8" rx="2" fill="rgba(255,255,255,.25)"/>${heart(0,-40,.45,'#fff')}`}`;
function legsOf(o,pants,shoe,xs,lw,sole='#efe9df'){
  return xs.map((x,k)=>`<g class="${o.walk?(k?'legB':'legA'):''}"><rect x="${x}" y="-27" width="${lw}" height="26" rx="3.2" fill="${pants}"/><rect x="${x+.8}" y="-26" width="${lw/3}" height="23" rx="1.6" fill="#fff" opacity=".1"/><ellipse cx="${x+lw/2+1}" cy="-1.2" rx="${lw*.78}" ry="3.4" fill="${shoe}"/><path d="M${x-lw*.2},.9 h${lw*1.5}" stroke="${sole}" stroke-width="1.3" stroke-linecap="round"/></g>`).join('')}
const scarfOf=c=>c?`<path d="M-10,-57 Q0,-49 10,-57 L11,-51.5 Q0,-44 -11,-51.5Z" fill="${c}"/><path d="M3,-51 l7,1 l-1.5,15 l-6,-1Z" fill="${c}"/><path d="M-9,-54 Q0,-47.5 9,-54 M4,-45 l5,.8 M3.6,-40.5 l5,.8" stroke="#fff" stroke-opacity=".35" stroke-width="1" fill="none"/>`:'';
const torsoFx=(w,hl)=>`<path d="M${-w+3},-27 Q${-w+1},-50 -4,-53 Q${-w+6},-46 ${-w+7},-27Z" fill="${hl}" opacity=".5"/><path d="M${-w},-24 Q${-w-.6},-31 ${-w-.4},-34 Q0,-27 ${w+.4},-34 Q${w+.6},-31 ${w},-24Z" fill="#000" opacity=".14"/>`;

function guy(x,y,o={}){const s=o.s||1.38,out=o.outfit||'fleece';
  const top={fleece:'#1d1d23',apron:'#efece5',black:'#151518',tee:'#f3f0ea'}[out];
  const hl={fleece:'#3a3a46',apron:'#ffffff',black:'#33333b',tee:'#ffffff'}[out];
  const pants=out==='fleece'?'#a9aab0':'#2a2a30';
  let ex='';

/* ---------- главы из ваших моментов ---------- */
const TPL={cinema:scenes[4],bench:scenes[5],flowers:scenes[6],cafe:scenes[9],trip:scenes[12],cook:scenes[13],movie:scenes[16]};
const DEF={walk:'Ещё одна наша прогулка. Неважно куда — главное, что вместе.',movie:'Вечер, фильм и ты рядом. Больше ничего и не нужно.',
  cinema:'Кино, попкорн и мы рядом в темноте.',cook:'Готовили на кухне. Вкусно, но вместе ещё вкуснее.',cafe:'Кофейня, разговоры обо всём и твоя улыбка напротив.',
  trip:'Новая дорога, новые места — и мы вдвоём.',bench:'Вечер на лавочке. Опять не хотелось расходиться.',flowers:'Цветы — и снова эта улыбка.'};
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const ruDate=iso=>`${Number(iso.slice(8,10))} ${MON[Number(iso.slice(5,7))-1]}`;
const cityOf=t=>{const w=t.replace(/[«»"!?.,]/g,' ').split(/\s+/).filter(Boolean);for(let k=w.length-1;k>0;k--)if(/^[A-ZА-ЯЁ]/.test(w[k])&&w[k].length>2&&w[k].length<=12)return w[k].toUpperCase();return ''};
function momentScene(m){
  const draw=m.scene==='walk'?()=>walkScene(seasonOf(m.happened_on)):TPL[m.scene];
  if(!draw)return null;
  return ()=>{window.__nob=true;window.__sign=m.scene==='trip'?cityOf(m.title):undefined;
    try{return draw()+label(392,26,ruDate(m.happened_on),'end')}finally{window.__nob=false;window.__sign=undefined}};
}
async function loadMoments(){
  const init=tg?.initData||(()=>{try{return sessionStorage.getItem('initData')||''}catch(e){return ''}})();
  const res=await fetch('/api/story',{headers:{'X-Init-Data':init}});
  if(!res.ok)return 0;
  const list=await res.json();let n=0;
  const at=scenes.length-1;   // перед финалом «Продолжение следует…»
  const firstNo=17;
  for(const m of list){const fn=momentScene(m);if(!fn)continue;
    const title=m.title.length>38?m.title.slice(0,36)+'…':m.title;
    scenes.splice(at+n,0,fn);caps.splice(at+n,0,[`Глава ${firstNo+n+1} · ${title}`,m.text?.trim()||DEF[m.scene]]);n++}
  return n;
}

/* ---------- player ---------- */
const sv=document.getElementById('sv'),bar=document.getElementById('bar'),startB=document.getElementById('start'),
  eb=document.getElementById('eb'),ct=document.getElementById('ct'),dots=document.getElementById('dots'),
  playB=document.getElementById('play'),musB=document.getElementById('mus');
const DUR=7000;let LAST=scenes.length-1;let i=0,playing=false,t=null;
function buildDots(){dots.innerHTML='';scenes.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.setAttribute('aria-label','Сцена '+(k+1));b.onclick=()=>go(k);dots.appendChild(b)})}
buildDots();
function setPlay(p){playing=p;playB.textContent=p?'❚❚ Пауза':'▶ Играть'}
function go(n){
  clearTimeout(t);i=Math.max(0,Math.min(LAST,n));
  sv.innerHTML=`<g class="scn"><g class="${i%2?'kb':'kb2'}">${scenes[i]()}</g></g><defs><radialGradient id="vg" cx=".5" cy=".52" r=".78"><stop offset=".58" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0a0612" stop-opacity=".5"/></radialGradient></defs><rect width="400" height="300" fill="url(#vg)" pointer-events="none"/>`;
  eb.textContent=caps[i][0];ct.textContent=caps[i][1];ct.classList.remove('in');void ct.offsetWidth;ct.classList.add('in');
  [...dots.children].forEach((d,k)=>{d.classList.toggle('on',k===i);d.classList.toggle('done',k<i)});document.getElementById('chip').textContent=i?`${i} / ${LAST}`:'';document.getElementById('chip').hidden=!i;
  startB.hidden=i!==0;startB.textContent='▶ Смотреть';
  bar.classList.remove('run');void bar.offsetWidth;bar.style.animationDuration=DUR+'ms';
  if(playing){bar.classList.add('run');
    t=setTimeout(()=>{if(i<LAST)go(i+1);else{setPlay(false);startB.textContent='↺ Посмотреть ещё раз';startB.hidden=false}},DUR)}
}
startB.addEventListener('click',e=>{e.stopPropagation();setPlay(true);if(!musicOn)toggleMusic();go(1)});
document.getElementById('stage').addEventListener('click',()=>{if(i<LAST)go(i+1)});
document.getElementById('stage').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i<LAST)go(i+1)}});
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
playB.onclick=()=>{setPlay(!playing);go(i===0&&playing?1:i)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});

/* ---------- music box ---------- */
let actx=null,master=null,musicOn=false,timer=null,nextT=0,step=0;
const prog=[[261.63,329.63,392.0],[196.0,246.94,293.66],[220.0,261.63,329.63],[174.61,220.0,261.63]];
const pat=[0,1,2,1,0,2,1,2];
const mel=[523.25,0,493.88,0,440,0,392,0, 392,0,440,0,493.88,0,0,0, 523.25,0,587.33,0,523.25,0,440,0, 440,0,392,0,349.23,0,392,0];
function note(f,at,dur,vol,type='triangle'){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.05)}
function tick(){while(nextT<actx.currentTime+.35){const bar=Math.floor(step/8)%4,k=step%8,ch=prog[bar];
  note(ch[pat[k]]*(k===4?2:1),nextT,.9,.05);if(k===0)note(ch[0]/2,nextT,2.3,.05,'sine');
  const m=mel[step%32];if(m)note(m,nextT,1.1,.035,'sine');step++;nextT+=.3}}
function toggleMusic(){
  try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.9;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;master.disconnect();master.connect(lp).connect(actx.destination)}}catch(e){return}
  musicOn=!musicOn;
  if(musicOn){actx.resume();nextT=actx.currentTime+.05;timer=setInterval(tick,60);musB.textContent='♪ Музыка: вкл'}
  else{clearInterval(timer);musB.textContent='♪ Музыка: выкл'}
}
musB.onclick=toggleMusic;
setPlay(false);go(0);
loadMoments().then(n=>{if(!n)return;LAST=scenes.length-1;buildDots();[...dots.children].forEach((d,k)=>{d.classList.toggle('on',k===i);d.classList.toggle('done',k<i)})}).catch(()=>{});
</script>
