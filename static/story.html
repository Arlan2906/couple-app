<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш мультик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one centered "cinema" player, caption card under the frame, controls row. Single night theme by choice. */
:root{
  --bg:#17121f; --panel:#221a2c; --line:#3b2f47; --fg:#f8ece4; --muted:#bcaabd;
  --rose:#ff8fa8; --gold:#f5c46b;
  --hand:'Neucha','Comic Sans MS',cursive; --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.back{font:700 14px var(--body);color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;align-self:flex-start}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--hand);font-weight:400;font-size:clamp(36px,9vw,54px);margin:0;line-height:1;text-wrap:balance}
header h1 span{color:var(--rose)}
header p{margin:6px 0 0;color:var(--muted);font-size:15px}
.stage{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:20px;overflow:hidden;background:#0d0a12;
  box-shadow:0 24px 60px -24px rgba(255,143,168,.45);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage svg{display:block;width:100%;height:100%}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--rose)}
.bar.run{animation:bar linear forwards}
@keyframes bar{to{width:100%}}
.startbtn{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font:800 17px var(--body);padding:12px 26px;border-radius:999px;border:0;
  background:var(--rose);color:#2a1220;cursor:pointer;box-shadow:0 8px 24px -6px rgba(255,143,168,.7);white-space:nowrap}
.startbtn:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-height:104px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;min-height:15px}
.captext{font-family:var(--hand);font-size:clamp(21px,4.8vw,26px);line-height:1.3;margin-top:4px}
.captext.in{animation:capin .7s ease both}
@keyframes capin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:700 14px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.dots{display:flex;gap:5px;flex:1;justify-content:center;min-width:0;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer;transition:width .3s,background .3s}
.dot.on{background:var(--rose);width:20px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:0}

/* scene animation */
.hand{font-family:var(--hand)} .ui{font-family:var(--body)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.popbig{transform-box:fill-box;transform-origin:center;animation:popbig 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popbig{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.rise{animation:rise 3.4s ease-in infinite both}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.15)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall 7s linear infinite}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,320px) rotate(400deg)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.flick{animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.75}}
.flick2{animation:flick2 .9s steps(3) infinite}
@keyframes flick2{0%{opacity:1}33%{opacity:.8}66%{opacity:.93}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.drift-r{animation:dr 7s ease-in-out both}
@keyframes dr{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.drift-l{animation:dl 7s ease-in-out both}
@keyframes dl{from{transform:translateX(26px)}to{transform:translateX(-26px)}}
.drive{animation:drive 5s linear infinite}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.sunup{animation:sunup 6.5s ease-out both}
@keyframes sunup{from{transform:translateY(70px)}to{transform:translateY(0)}}
.fadeout{animation:fadeout 5.5s ease-out both}
@keyframes fadeout{from{opacity:.85}to{opacity:0}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flame .5s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.glowtext{animation:flick 2.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .stage *{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .captext.in{animation:none}
}
</style>
</head>
<body>


<div class="wrap">
  <button class="back" id="back" type="button">← Назад</button>
  <header>
    <h1>Арлан <span>+</span> Настя</h1>
    <p>Мультик о том, как всё началось</p>
  </header>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Следующая сцена">
    <svg id="sv" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="bar" id="bar"></div>
    <button class="startbtn" id="start" type="button">▶ Смотреть</button>
  </div>

  <div class="cap" aria-live="polite">
    <div class="eyebrow" id="eb"></div>
    <div class="captext" id="ct"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prev" type="button" aria-label="Назад">◀</button>
    <button class="btn" id="play" type="button">❚❚ Пауза</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="mus" type="button">♪ Музыка</button>
    <button class="btn" id="next" type="button" aria-label="Вперёд">▶</button>
  </div>
  <p class="hint">Нажми на кадр, чтобы перейти к следующей сцене</p>
</div>

<script>
/* Telegram Mini App: системная кнопка «Назад» возвращает в приложение */
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const goBack=()=>{if(history.length>1)history.back();else location.href='/'};
document.getElementById('back').onclick=goBack;
if(tg?.BackButton&&tg.isVersionAtLeast?.('6.1')){tg.BackButton.show();tg.BackButton.onClick(goBack)}
/* ---------- helpers ---------- */
const R=seed=>{let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647};
const f1=n=>n.toFixed(1);
function stars(n,maxY=150,seed=3){const r=R(seed);let o='';for(let k=0;k<n;k++){o+=`<circle class="tw" style="animation-delay:${f1(r()*3)}s" cx="${f1(r()*400)}" cy="${f1(r()*maxY)}" r="${(r()*1.1+.3).toFixed(2)}" fill="#fff"/>`}return o}
const HEART='M0 8 C -10 0 -12 -8 -6 -10 C -3 -11 -1 -9 0 -7 C 1 -9 3 -11 6 -10 C 12 -8 10 0 0 8Z';
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="${HEART}" fill="${c}"/>`;
function rising(x,y,n,seed=9,base=0){const r=R(seed);let o='';for(let k=0;k<n;k++){o+=`<g class="rise" style="animation-delay:${f1(base+k*.6+r()*.3)}s">${heart(f1(x+(r()-.5)*40),f1(y+(r()-.5)*10),(r()*.5+.7).toFixed(2),k%2?'#ff8fa8':'#ff5f7e')}</g>`}return o}
function bubble(x,y,t,d=0,side='l'){const w=t.length*6.4+24,bx=x-w/2;
  const tail=side==='none'?`<circle cx="${x-8}" cy="${y+17}" r="3" fill="#fffaf5" stroke="#2b2030" stroke-width="1.2"/><circle cx="${x-13}" cy="${y+24}" r="2" fill="#fffaf5" stroke="#2b2030" stroke-width="1.2"/>`
   :side==='l'?`<path d="M${x-w/4},${y+10} l-7,10 l14,-10" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4" stroke-linejoin="round"/>`
   :`<path d="M${x+w/4},${y+10} l7,10 l-14,-10" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4" stroke-linejoin="round"/>`;
  return `<g class="pop" style="animation-delay:${d}s">${tail}<rect x="${f1(bx)}" y="${y-13}" width="${f1(w)}" height="24" rx="12" fill="#fffaf5" stroke="#2b2030" stroke-width="1.4"/><rect x="${f1(bx+1)}" y="${y+5}" width="${f1(w-2)}" height="5" fill="#fffaf5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11.5" font-weight="800" class="ui" fill="#2b2030">${t}</text></g>`}
const hu=(x,y,s,w)=>[x+(w+10)*s,y-67*s];

/* ---------- characters ---------- */
const G={sk:'#c68a60',hair:'#1a120e'}, N={sk:'#f3c4a8',hair:'#5b3a29'};
function eyes(o,dx,y,col){
  if(o.mood==='laugh')return `<path d="M${-dx-3},${y+1} Q${-dx},${y-3} ${-dx+3},${y+1} M${dx-3},${y+1} Q${dx},${y-3} ${dx+3},${y+1}" stroke="#2a1a14" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  return `<g class="blink"><circle cx="${-dx}" cy="${y}" r="2.2" fill="${col}"/><circle cx="${dx}" cy="${y}" r="2.2" fill="${col}"/><circle cx="${-dx+.7}" cy="${y-.8}" r=".7" fill="#fff"/><circle cx="${dx+.7}" cy="${y-.8}" r=".7" fill="#fff"/></g>`}
function mouth(o,y){const m=o.mood||'smile';
  if(m==='laugh')return `<path d="M-7,${y-2} Q0,${y+9} 7,${y-2}Z" fill="#7a2e33"/><path d="M-5,${y-1.3} H5" stroke="#fff" stroke-width="1.7"/>`;
  if(m==='o')return `<ellipse cx="0" cy="${y}" rx="2.4" ry="3" fill="#7a2e33"/>`;
  return `<path d="M-5.5,${y-1.5} Q0,${y+3.8} 5.5,${y-1.5}" stroke="#5a2a24" stroke-width="1.8" fill="none" stroke-linecap="round"/>`}
function blush(o,y,dx=12){const op=o.blush?.6:.22;return `<ellipse cx="${-dx}" cy="${y}" rx="4.2" ry="2.5" fill="#ff7f8e" opacity="${op}"/><ellipse cx="${dx}" cy="${y}" rx="4.2" ry="2.5" fill="#ff7f8e" opacity="${op}"/>`}
function arms(o,top,sk,w){
  const L=`<path d="M${-w},-49 Q${-w-8},-38 ${-w-5},-27" stroke="${top}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="${-w-5}" cy="-25" r="4" fill="${sk}"/>`;
  const Rr=o.arm==='up'
    ?`<path d="M${w},-49 Q${w+12},-50 ${w+10},-64" stroke="${top}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="${w+10}" cy="-67" r="4" fill="${sk}"/>`
    :`<path d="M${w},-49 Q${w+8},-38 ${w+5},-27" stroke="${top}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="${w+5}" cy="-25" r="4" fill="${sk}"/>`;
  return L+Rr}
const apron=(c='#8d8a6f',logo=true)=>`<path d="M-13,-47 L13,-47 L15,-14 L-15,-14Z" fill="${c}"/><path d="M-11,-47 L-15,-54 M11,-47 L15,-54" stroke="${c}" stroke-width="2.5"/>${logo?`<circle cx="0" cy="-33" r="4.5" fill="none" stroke="#f3f0e6" stroke-width="1.2"/><circle cx="-9" cy="-44" r="1.6" fill="#cfcfcf"/><circle cx="9" cy="-44" r="1.6" fill="#cfcfcf"/>`:`<rect x="-6" y="-32" width="12" height="8" rx="2" fill="rgba(255,255,255,.25)"/>${heart(0,-40,.45,'#fff')}`}`;

function guy(x,y,o={}){const s=o.s||1.38,out=o.outfit||'fleece';
  const top={fleece:'#1d1d23',apron:'#efece5',black:'#151518'}[out];
  const pants=out==='fleece'?'#a9aab0':'#2a2a30';
  let ex='';
  if(out==='fleece')ex=`<path d="M0,-53 V-25" stroke="#4a4a55" stroke-width="1.3"/><path d="M-6,-55 L0,-50 L6,-55" stroke="#4a4a55" stroke-width="1.6" fill="none"/><rect x="5" y="-46" width="6" height="3.4" fill="#c8303a"/><path d="M5,-44.3 h6 M7.4,-46 v3.4" stroke="#fff" stroke-width=".7"/>`;
  if(out==='apron')ex=apron();
  if(out==='black')ex=`<path d="M-7,-54 L0,-46 L7,-54" stroke="#33333b" stroke-width="2" fill="none"/>`;
  if(o.apronC)ex+=apron(o.apronC,false);
  if(o.bag)ex+=`<path d="M-12,-53 L-14,-28 M12,-53 L14,-28" stroke="#dcdcd6" stroke-width="3.2"/>`;
  const hair=[[-17,-80,7],[-12,-90,7.5],[-3,-95,8],[7,-94,8],[15,-88,7.5],[19,-79,6],[-19,-71,4.5],[19,-71,4.5],[-8,-86,6.5],[3,-88,6.5],[12,-84,5]].map(([a,b,r])=>`<circle cx="${a}" cy="${b}" r="${r}"/>`).join('');
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||'bob'}">
<rect x="-11" y="-26" width="9" height="25" rx="3" fill="${pants}"/><rect x="2" y="-26" width="9" height="25" rx="3" fill="${pants}"/>
<ellipse cx="-7" cy="-1" rx="7" ry="3.2" fill="#222"/><ellipse cx="7" cy="-1" rx="7" ry="3.2" fill="#222"/>
<path d="M-18,-24 Q-20,-54 0,-55 Q20,-54 18,-24Z" fill="${top}"/>${ex}
${arms(o,top,G.sk,14)}
<rect x="-4" y="-60" width="8" height="8" fill="${G.sk}"/>
<circle cx="-19" cy="-74" r="4.5" fill="${G.sk}"/><circle cx="19" cy="-74" r="4.5" fill="${G.sk}"/>
<circle cx="0" cy="-75" r="19" fill="${G.sk}"/>
<g fill="${G.hair}">${hair}</g>
${blush(o,-66)}${eyes(o,9.5,-75.5,'#2a1a14')}
<g fill="rgba(255,255,255,.16)" stroke="#2b2b30" stroke-width="1.5"><rect x="-15" y="-80.5" width="11" height="9" rx="2.2"/><rect x="4" y="-80.5" width="11" height="9" rx="2.2"/></g>
<path d="M-4,-77 H4 M-15,-77 L-19,-76 M15,-77 L19,-76" stroke="#2b2b30" stroke-width="1.3"/>
${mouth(o,-63)}
</g></g>`}

function girl(x,y,o={}){const s=o.s||1.3,out=o.outfit||'leather';
  const top={leather:'#4b2d21',hoodie:'#eaa79c',apron:'#efece5',black:'#18171b'}[out];
  const pants=out==='hoodie'?'#8e8f97':'#202027';
  const cross=`<path d="M0,-44 v4.5 M-1.5,-42.6 h3" stroke="#eee5d2" stroke-width=".9"/>`;
  let ex='';
  if(out==='leather')ex=`<path d="M-6,-53 L0,-38 L6,-53Z" fill="#2b1c16"/><path d="M-6,-53 L-11,-47 L-4,-44Z M6,-53 L11,-47 L4,-44Z" fill="#6a4231"/>${cross}`;
  if(out==='hoodie')ex=`<path d="M-9,-53 Q0,-46 9,-53" stroke="#d48d83" stroke-width="2.6" fill="none"/><path d="M-3,-50 v9 M3,-50 v9" stroke="#f8d6d0" stroke-width="1.2"/><path d="M-11,-35 H11 V-28 H-11Z" fill="#df978c"/>`;
  if(out==='apron')ex=apron();
  if(out==='black')ex=`<path d="M-6,-53 Q0,-41 6,-53" stroke="#eee5d2" stroke-width=".7" fill="none"/>${cross}`;
  if(o.apronC)ex+=apron(o.apronC,false);
  const back=o.hair==='pony'?`<ellipse cx="0" cy="-78" rx="19.5" ry="18" fill="${N.hair}"/>`
    :`<path d="M-21,-74 Q-23,-44 -17,-35 Q-8,-31 0,-35 Q8,-31 17,-35 Q23,-44 21,-74 Q20,-95 0,-95 Q-20,-95 -21,-74Z" fill="${N.hair}"/>`;
  const lash=o.mood==='laugh'?'':`<path d="M-11,-74.5 l-2,-1.6 M11,-74.5 l2,-1.6" stroke="#2a1a14" stroke-width="1.1"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||'bob'}">
${back}
<rect x="-9.5" y="-26" width="8" height="25" rx="3" fill="${pants}"/><rect x="1.5" y="-26" width="8" height="25" rx="3" fill="${pants}"/>
<ellipse cx="-6" cy="-1" rx="6" ry="3" fill="#2a2228"/><ellipse cx="6" cy="-1" rx="6" ry="3" fill="#2a2228"/>
<path d="M-15,-24 Q-17,-52 0,-53 Q17,-52 15,-24Z" fill="${top}"/>${ex}
${arms(o,top,N.sk,13)}
<rect x="-3.5" y="-58" width="7" height="7" fill="${N.sk}"/>
<circle cx="0" cy="-73" r="18" fill="${N.sk}"/>
<path d="M-18.6,-68 Q-21,-93 0,-92 Q21,-93 18.6,-68 Q17,-83 3,-86 Q0,-84 -3,-86 Q-17,-83 -18.6,-68Z" fill="${N.hair}"/>
<circle cx="-18" cy="-67" r="1.3" fill="#ece6d8"/><circle cx="18" cy="-67" r="1.3" fill="#ece6d8"/>
<g fill="#c98a6c" opacity=".6"><circle cx="-10" cy="-67" r=".6"/><circle cx="-7" cy="-66" r=".6"/><circle cx="7" cy="-66" r=".6"/><circle cx="10" cy="-67" r=".6"/></g>
${blush(o,-65,11)}${eyes(o,8,-72.5,'#3f7457')}${lash}
${mouth(o,-62)}
</g></g>`}

/* ---------- props ---------- */
const cup=(x,y)=>`<g transform="translate(${f1(x)} ${f1(y)})"><path class="steam" d="M-1,-6 q-3,-4 0,-8 q3,-4 0,-8" stroke="#fff" stroke-opacity=".75" fill="none" stroke-width="1.3"/><path d="M-5,0 L5,0 L4,12 L-4,12Z" fill="#f4efe6"/><rect x="-6" y="-2" width="12" height="3" rx="1" fill="#6b4a36"/><rect x="-4.6" y="4" width="9.2" height="4" fill="#b98a62"/></g>`;
const tray=(x,y)=>`<g transform="translate(${f1(x)} ${f1(y)})"><rect x="-10" y="-11" width="7" height="9" rx="1.5" fill="#fff"/><rect x="2" y="-13" width="6" height="11" rx="1" fill="#e8d7c0"/><ellipse cx="0" cy="-1" rx="17" ry="3.6" fill="#3a3a40"/></g>`;
const phone=(x,y)=>`<g transform="translate(${f1(x)} ${f1(y)})"><rect x="-5.5" y="-10" width="11" height="19" rx="2.4" fill="#26222b"/><rect x="-4.2" y="-8.3" width="8.4" height="15" rx="1.2" fill="#9fd0ff" class="flick"/></g>`;
function bouquet(x,y){const r=R(21);let ro='';const pts=[];for(let k=0;k<30;k++){const a=r()*Math.PI*2,d=Math.sqrt(r());pts.push([Math.cos(a)*d*30,Math.sin(a)*d*11-19])}
  pts.sort((a,b)=>a[1]-b[1]).forEach(([a,b])=>{ro+=`<circle cx="${f1(a)}" cy="${f1(b)}" r="5.3" fill="#fbd0d4"/><circle cx="${f1(a)}" cy="${f1(b)}" r="2.7" fill="#ec7f98"/>`});
  return `<g transform="translate(${x} ${y})"><path d="M-37,-16 L37,-16 L9,48 L-9,48Z" fill="#f4a6c8"/><ellipse cx="0" cy="-19" rx="34" ry="13" fill="#2f6b3e"/>${ro}<path d="M-39,-12 Q0,6 39,-12 L31,10 Q0,22 -31,10Z" fill="#e87cb0"/><path d="M-10,40 L10,40 L17,57 L0,48 L-17,57Z" fill="#f8b6d4"/></g>`}
const popcorn=(x,y)=>`<g transform="translate(${x} ${y})"><g fill="#fff4cf"><circle cx="-8" cy="-21" r="5"/><circle cx="0" cy="-24" r="5.5"/><circle cx="8" cy="-21" r="5"/><circle cx="-3" cy="-19" r="4"/><circle cx="4" cy="-19" r="4"/></g><path d="M-12,-18 L12,-18 L9,8 L-9,8Z" fill="#fff"/><path d="M-8,-18 L-6.5,8 L-3.5,8 L-4.5,-18Z M3.5,-18 L3,8 L6,8 L8,-18Z" fill="#d8323f"/></g>`;
function benchBack(x,g,w,s=1.35){return `<g fill="#6b4630"><rect x="${x-w/2}" y="${g-62*s}" width="${w}" height="${7*s}" rx="2"/><rect x="${x-w/2}" y="${g-50*s}" width="${w}" height="${7*s}" rx="2"/></g>`}

/* ---------- player ---------- */
const sv=document.getElementById('sv'),bar=document.getElementById('bar'),startB=document.getElementById('start'),
  eb=document.getElementById('eb'),ct=document.getElementById('ct'),dots=document.getElementById('dots'),
  playB=document.getElementById('play'),musB=document.getElementById('mus');
const DUR=7000,LAST=scenes.length-1;let i=0,playing=false,t=null;
scenes.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.setAttribute('aria-label','Сцена '+(k+1));b.onclick=()=>go(k);dots.appendChild(b)});
function setPlay(p){playing=p;playB.textContent=p?'❚❚ Пауза':'▶ Играть'}
function go(n){
  clearTimeout(t);i=Math.max(0,Math.min(LAST,n));
  sv.innerHTML=scenes[i]();
  eb.textContent=caps[i][0];ct.textContent=caps[i][1];ct.classList.remove('in');void ct.offsetWidth;ct.classList.add('in');
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  startB.hidden=i!==0;startB.textContent='▶ Смотреть';
  bar.classList.remove('run');void bar.offsetWidth;bar.style.animationDuration=DUR+'ms';
  if(playing){bar.classList.add('run');
    t=setTimeout(()=>{if(i<LAST)go(i+1);else{setPlay(false);startB.textContent='↺ Посмотреть ещё раз';startB.hidden=false}},DUR)}
}
startB.addEventListener('click',e=>{e.stopPropagation();setPlay(true);if(!musicOn)toggleMusic();go(1)});
document.getElementById('stage').addEventListener('click',()=>{if(i<LAST)go(i+1)});
document.getElementById('stage').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i<LAST)go(i+1)}});
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
playB.onclick=()=>{setPlay(!playing);go(i===0&&playing?1:i)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});

/* ---------- music box ---------- */
let actx=null,master=null,musicOn=false,timer=null,nextT=0,step=0;
const prog=[[261.63,329.63,392.0],[196.0,246.94,293.66],[220.0,261.63,329.63],[174.61,220.0,261.63]];
const pat=[0,1,2,1,0,2,1,2];
const mel=[523.25,0,493.88,0,440,0,392,0, 392,0,440,0,493.88,0,0,0, 523.25,0,587.33,0,523.25,0,440,0, 440,0,392,0,349.23,0,392,0];
function note(f,at,dur,vol,type='triangle'){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.05)}
function tick(){while(nextT<actx.currentTime+.35){const bar=Math.floor(step/8)%4,k=step%8,ch=prog[bar];
  note(ch[pat[k]]*(k===4?2:1),nextT,.9,.05);if(k===0)note(ch[0]/2,nextT,2.3,.05,'sine');
  const m=mel[step%32];if(m)note(m,nextT,1.1,.035,'sine');step++;nextT+=.3}}
function toggleMusic(){
  try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.9;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;master.disconnect();master.connect(lp).connect(actx.destination)}}catch(e){return}
  musicOn=!musicOn;
  if(musicOn){actx.resume();nextT=actx.currentTime+.05;timer=setInterval(tick,60);musB.textContent='♪ Музыка: вкл'}
  else{clearInterval(timer);musB.textContent='♪ Музыка: выкл'}
}
musB.onclick=toggleMusic;
setPlay(false);go(0);
</script>
